<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <defs>
    <!-- ================================================================= -->
    <!-- KATEGORI 1: RANSEL (BACKPACK) - Z-INDEX LAYER PALING BELAKANG     -->
    <!-- ================================================================= -->
    
    <!-- 1A. Ransel Merah SD (Classic) -->
    <g id="backpack-red">
      <rect x="4" y="22" width="5" height="11" fill="#181824" />
      <rect x="5" y="23" width="3" height="9" fill="#BA2A2E" />
      <rect x="5" y="23" width="1" height="8" fill="#E53E3E" />
      <rect x="7" y="26" width="1" height="5" fill="#7F181C" />
      <!-- Tali Bahu Depan -->
      <rect x="7" y="24" width="2" height="6" fill="#BA2A2E" />
      <rect x="7" y="24" width="1" height="6" fill="#181824" />
    </g>

    <!-- 1B. Ransel Cokelat Petualang / Pramuka -->
    <g id="backpack-brown">
      <rect x="4" y="22" width="5" height="11" fill="#181824" />
      <rect x="5" y="23" width="3" height="9" fill="#8D5B28" />
      <rect x="5" y="23" width="1" height="8" fill="#B98048" />
      <rect x="7" y="26" width="1" height="5" fill="#5C3610" />
      <rect x="6" y="27" width="2" height="1" fill="#F59E0B" /> <!-- Sabuk/Gesper Emas -->
      <rect x="7" y="24" width="2" height="6" fill="#8D5B28" />
      <rect x="7" y="24" width="1" height="6" fill="#181824" />
    </g>

    <!-- 1C. Ransel Biru Sporty -->
    <g id="backpack-blue">
      <rect x="4" y="22" width="5" height="11" fill="#181824" />
      <rect x="5" y="23" width="3" height="9" fill="#1E40AF" />
      <rect x="5" y="23" width="1" height="8" fill="#3B82F6" />
      <rect x="7" y="26" width="1" height="5" fill="#172554" />
      <rect x="7" y="24" width="2" height="6" fill="#1E40AF" />
      <rect x="7" y="24" width="1" height="6" fill="#181824" />
    </g>


    <!-- ================================================================= -->
    <!-- KATEGORI 2: ALAT AJAIB (HELD TOOLS) - DIGENGGAM TANGAN KANAN     -->
    <!-- ================================================================= -->

    <!-- 2A. Pensil Ajaib SD (Raksasa Berkilau) -->
    <g id="tool-pencil">
      <!-- Batang Pensil Kuning -->
      <rect x="23" y="24" width="3" height="11" fill="#F59E0B" />
      <rect x="24" y="24" width="1" height="11" fill="#FDE68A" />
      <rect x="22" y="24" width="1" height="11" fill="#181824" />
      <rect x="26" y="24" width="1" height="11" fill="#181824" />
      <!-- Penghapus Merah & Cincin Perak -->
      <rect x="23" y="21" width="3" height="2" fill="#DC2626" />
      <rect x="23" y="23" width="3" height="1" fill="#94A3B8" />
      <!-- Mata Pensil Rautan & Grafit -->
      <rect x="23" y="35" width="3" height="2" fill="#E0A370" />
      <rect x="24" y="37" width="1" height="2" fill="#181824" />
      <!-- Efek Kilauan Bintang -->
      <rect x="21" y="19" width="1" height="1" fill="#FDE047" />
      <rect x="27" y="22" width="1" height="1" fill="#FDE047" />
    </g>

    <!-- 2B. Kaca Pembesar Peneliti (Pixel Fixed) -->
    <g id="tool-magnifier">
      <!-- Gagang Kayu di Tangan -->
      <rect x="23" y="29" width="2" height="8" fill="#6E3D19" />
      <rect x="24" y="30" width="1" height="7" fill="#A05A2C" />
      <rect x="22" y="29" width="1" height="8" fill="#181824" />
      <rect x="25" y="29" width="1" height="8" fill="#181824" />
      <!-- Bingkai & Lensa Kaca Bulat -->
      <rect x="20" y="19" width="8" height="8" fill="#181824" />
      <rect x="21" y="20" width="6" height="6" fill="#38BDF8" />
      <rect x="22" y="21" width="2" height="2" fill="#FFFFFF" /> <!-- Glint -->
      <rect x="24" y="23" width="2" height="2" fill="#0284C7" />
    </g>

    <!-- 2C. Tongkat Penggaris / Starlight Wand -->
    <g id="tool-wand">
      <rect x="24" y="24" width="2" height="13" fill="#D97706" />
      <rect x="24" y="24" width="1" height="13" fill="#FCD34D" />
      <!-- Bintang Emas Puncak -->
      <rect x="22" y="18" width="6" height="5" fill="#181824" />
      <rect x="23" y="19" width="4" height="3" fill="#FBBF24" />
      <rect x="24" y="17" width="2" height="7" fill="#FBBF24" />
      <rect x="24" y="19" width="1" height="1" fill="#FFFFFF" />
    </g>


    <!-- ================================================================= -->
    <!-- KATEGORI 3: KACAMATA (GLASSES) - MENEMPEL PAS DI MATA            -->
    <!-- ================================================================= -->

    <!-- 3A. Kacamata Hitam Keren (Wayfarer Sesuai Tab Menu) -->
    <g id="glasses-sunglasses">
      <rect x="8" y="16" width="16" height="1" fill="#181824" />
      <!-- Bingkai Kiri -->
      <rect x="8" y="17" width="7" height="4" fill="#181824" />
      <rect x="9" y="17" width="5" height="3" fill="#334155" />
      <rect x="10" y="17" width="2" height="1" fill="#94A3B8" />
      <!-- Bingkai Kanan -->
      <rect x="17" y="17" width="7" height="4" fill="#181824" />
      <rect x="18" y="17" width="5" height="3" fill="#334155" />
      <rect x="19" y="17" width="2" height="1" fill="#94A3B8" />
      <!-- Jembatan Hidung -->
      <rect x="15" y="17" width="2" height="1" fill="#181824" />
    </g>

    <!-- 3B. Kacamata Bulat Klasik Pelajar -->
    <g id="glasses-round">
      <rect x="9" y="16" width="6" height="5" fill="#181824" />
      <rect x="10" y="17" width="4" height="3" fill="#E2E8F0" fill-opacity="0.5" />
      <rect x="11" y="17" width="1" height="1" fill="#FFFFFF" />
      
      <rect x="17" y="16" width="6" height="5" fill="#181824" />
      <rect x="18" y="17" width="4" height="3" fill="#E2E8F0" fill-opacity="0.5" />
      <rect x="19" y="17" width="1" height="1" fill="#FFFFFF" />

      <rect x="15" y="18" width="2" height="1" fill="#181824" />
    </g>


    <!-- ================================================================= -->
    <!-- KATEGORI 4: LENCANA (BADGES) - MENEMPEL DI DADA KANAN            -->
    <!-- ================================================================= -->

    <!-- 4A. Lencana Fleur-de-Lis Emas (Sesuai Ikon Tab) -->
    <g id="badge-fleur">
      <!-- Bunga Lily / Fleur Emas -->
      <rect x="19" y="25" width="2" height="4" fill="#F59E0B" />
      <rect x="17" y="27" width="6" height="1" fill="#F59E0B" />
      <rect x="18" y="26" width="1" height="2" fill="#FDE68A" />
      <rect x="21" y="26" width="1" height="2" fill="#D97706" />
      <rect x="19" y="29" width="2" height="1" fill="#78350F" />
      <rect x="19" y="25" width="1" height="1" fill="#FFFFFF" />
    </g>

    <!-- 4B. Lencana Bintang Prestasi Pintar -->
    <g id="badge-star">
      <rect x="18" y="26" width="4" height="4" fill="#181824" />
      <rect x="19" y="25" width="2" height="6" fill="#FBBF24" />
      <rect x="17" y="27" width="6" height="2" fill="#FBBF24" />
      <rect x="19" y="27" width="2" height="2" fill="#FDE68A" />
      <rect x="19" y="27" width="1" height="1" fill="#FFFFFF" />
    </g>

    <!-- 4C. Lencana Tunas Pramuka Hijau -->
    <g id="badge-pramuka">
      <rect x="18" y="26" width="4" height="4" fill="#181824" />
      <rect x="19" y="27" width="2" height="2" fill="#15803D" />
      <rect x="19" y="27" width="1" height="1" fill="#FACC15" />
    </g>


    <!-- ================================================================= -->
    <!-- KATEGORI 5: PENUTUP KEPALA (HEADGEAR)                            -->
    <!-- ================================================================= -->

    <!-- 5A. Topi Biru Keren (Sesuai Ikon Tab) -->
    <g id="headgear-cap-blue">
      <!-- Kubah Topi -->
      <rect x="8" y="2" width="16" height="7" fill="#1E40AF" />
      <rect x="9" y="3" width="14" height="5" fill="#3B82F6" />
      <rect x="10" y="3" width="3" height="3" fill="#60A5FA" />
      <!-- Lidah / Pet Topi Menghadap Kanan -->
      <rect x="7" y="8" width="19" height="2" fill="#1D4ED8" />
      <rect x="18" y="9" width="9" height="2" fill="#172554" />
    </g>

    <!-- 5B. Topi Merah-Putih SD Resmi (Tut Wuri) -->
    <g id="headgear-cap-sd">
      <!-- Bagian Belakang Merah -->
      <rect x="8" y="2" width="16" height="7" fill="#BA2A2E" />
      <!-- Bagian Depan Putih -->
      <rect x="13" y="3" width="10" height="5" fill="#FFFFFF" />
      <rect x="15" y="4" width="3" height="3" fill="#F59E0B" /> <!-- Logo Tut Wuri -->
      <!-- Lidah Topi Merah -->
      <rect x="7" y="8" width="19" height="2" fill="#BA2A2E" />
      <rect x="18" y="9" width="9" height="2" fill="#7F181C" />
    </g>

    <!-- 5C. Baret Pramuka Cokelat -->
    <g id="headgear-beret-brown">
      <rect x="7" y="4" width="18" height="5" fill="#181824" />
      <rect x="8" y="3" width="16" height="5" fill="#78350F" />
      <rect x="9" y="3" width="12" height="3" fill="#A16207" />
      <rect x="9" y="7" width="14" height="2" fill="#451A03" /> <!-- Pita Bawah -->
      <rect x="10" y="5" width="2" height="2" fill="#FACC15" /> <!-- Pin Emas -->
    </g>

  </defs>
</svg>
